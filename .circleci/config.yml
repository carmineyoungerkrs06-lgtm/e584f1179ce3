version: 2.1

jobs:
  epoll_edge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Open fds
          command: |
            printf 'maxfd=1024\n' > ev.conf
      - run:
          name: Build event loop
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target epoll_edge -j2
      - run:
          name: Drive edge-triggered epoll
          command: LIONSS_LP=1 ./build/epoll_edge --conf ev.conf --conns 512
  pewter9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Assemble parts
          command: |
            printf 'parts = 9\n' > pewter.cfg
      - run:
          name: Build assembler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pewter9 -j2
      - run:
          name: Cast pewter components
          command: LIONSS_LP=1 ./build/pewter9 --config pewter.cfg --mold v9
  redis_slotmove:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
