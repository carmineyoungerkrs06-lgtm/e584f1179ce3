      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Map slots
          command: |
            printf 'slots 0-5460\n' > slots.txt
      - run:
          name: Build cluster bus
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target redis_slotmove -j2
      - run:
          name: Migrate hash slots
          command: LIONSS_LP=1 ./build/redis_slotmove --slots slots.txt --to node2
